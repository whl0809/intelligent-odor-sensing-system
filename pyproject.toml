[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ece450-food-classification"
version = "0.1.0"
description = "Training and evaluation pipeline for the ECE450 E-nose food classifier"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn==1.9.0",
]

[project.optional-dependencies]
display = ["Pillow>=10"]
test = ["pytest>=8"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
